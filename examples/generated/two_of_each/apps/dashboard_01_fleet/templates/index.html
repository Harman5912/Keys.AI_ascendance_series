<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fleet Operations Dashboard</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard">
        <h1>Fleet Operations Dashboard</h1>
        <div class="kpi-cards">
            <div class="kpi-card">
                <h2>Fuel Cost per Vehicle</h2>
                <div id="fuelCostChart"></div>
            </div>
            <div class="kpi-card">
                <h2>Total Maintenance Cost</h2>
                <div id="maintenanceCostChart"></div>
            </div>
            <div class="kpi-card">
                <h2>Overdue Services</h2>
                <div id="overdueServicesChart"></div>
            </div>
        </div>
        <div class="charts">
            <div class="chart">
                <h2>Distance per Day</h2>
                <div id="distanceChart"></div>
            </div>
            <div class="chart">
                <h2>Fuel Cost per Vehicle</h2>
                <div id="fuelCostChart"></div>
            </div>
        </div>
        <div class="table">
            <h2>Vehicles</h2>
            <table id="vehiclesTable">
                <thead>
                    <tr>
                        <th>Vehicle ID</th>
                        <th>Make</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Registration Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
