<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  body { font-family: Arial, sans-serif; }
  .kanban-board { display: flex; justify-content: space-around; margin-top: 20px; }
  .column { border: 1px solid #ccc; padding: 10px; width: 30%; min-width: 375px; box-sizing: border-box; }
  .card { margin: 5px 0; padding: 10px; background-color: #f9f9f9; border: 1px solid #ddd; }
  button:focus-visible { outline: 2px solid blue; }
</style>
</head>
<body>
<header><h1>Kanban Board</h1></header>
<main>
<div class="kanban-board">
  <div id="todo" class="column">
    <h2>To Do</h2>
    <form onsubmit="return addCard('todo');">
      <label for="title">Title:</label>
      <input type="text" id="title" required>
      <button type="submit">Add Card</button>
    </form>
    <div id="todo-cards"></div>
  </div>
  <div id="in-progress" class="column">
    <h2>In Progress</h2>
    <div id="in-progress-cards"></div>
  </div>
  <div id="done" class="column">
    <h2>Done</h2>
    <div id="done-cards"></div>
  </div>
</div>
</main>
<footer><p>&copy; 2023 Kanban Board</p></footer>
<script>
  const columns = { todo: [], 'in-progress': [], done: [] };

  function saveToLocalStorage() {
    localStorage.setItem('kanbanBoard', JSON.stringify(columns));
  }

  function loadFromLocalStorage() {
    const savedData = localStorage.getItem('kanbanBoard');
    if (savedData) columns = JSON.parse(savedData);
    renderCards();
  }

  function addCard(columnId) {
    const title = document.getElementById('title').value;
    if (!title.trim()) {
      alert('Title is required.');
      return false;
    }
    columns[columnId].push({ title });
    renderCards();
    saveToLocalStorage();
    return false;
  }

  function moveCard(sourceColumn, targetColumn) {
    const cardElement = sourceColumn.querySelector('.card');
    if (!cardElement) return;
    const cardTitle = cardElement.innerText.trim();
    const index = Array.from(sourceColumn.children).indexOf(cardElement);
    columns[sourceColumn.id].splice(index, 1);
    columns[targetColumn].push({ title: cardTitle });
    renderCards();
    saveToLocalStorage();
  }

  function deleteCard(columnId) {
    const card = document.getElementById(columnId).querySelector('.card:last-child');
    if (card) {
      const index = Array.from(document.getElementById(columnId).children).indexOf(card);
      columns[columnId].splice(index, 1);
      renderCards();
      saveToLocalStorage();
    }
  }

  function renderCards() {
    ['todo', 'in-progress', 'done'].forEach(columnId => {
      const column = document.getElementById(columnId);
      const cardsContainer = column.querySelector('div');
      while (cardsContainer.firstChild) cardsContainer.removeChild(cardsContainer.firstChild);
      columns[columnId].forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = card.title;
        div.innerHTML += `<button onclick="moveCard(document.getElementById('${columnId}'), document.getElementById('in-progress'))">Move to In Progress</button>
                        <button onclick="moveCard(document.getElementById('${columnId}'), document.getElementById('done'))">Move to Done</button>
                        <button onclick="deleteCard('${columnId}')">Delete</button>`;
        cardsContainer.appendChild(div);
      });
    });
  }

  window.addEventListener('load', loadFromLocalStorage);
</script>
</body>
</html>
