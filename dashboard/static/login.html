<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Keys.ai — Remote Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #000000;
      --card:   rgba(255,255,255,0.03);
      --border: rgba(255,215,0,0.12);
      --glow:   rgba(255,215,0,0.08);
      --accent: #FFD700;
      --yellow: #FFC107;
      --adim:   rgba(255,215,0,0.10);
      --text:   #FFFFFF;
      --muted:  #888888;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(255,193,7,0.02) 0%, transparent 50%);
    }
    .card {
      width: 360px;
      padding: 48px 38px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,215,0,0.02) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 80px rgba(255,215,0,0.03);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(255,215,0,0.03), transparent, rgba(255,215,0,0.03), transparent);
      animation: rotate 10s linear infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .card > * { position: relative; z-index: 1; }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 6px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #FFD700, #FFC107);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }
    .logo-dot {
      color: #FFD700;
      -webkit-text-fill-color: #FFD700;
    }
    .sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .version {
      font-size: 9px;
      color: rgba(255,215,0,0.3);
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-family: 'Courier New', monospace;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .hint strong {
      color: var(--accent);
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--accent);
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(255,215,0,0.15);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: rgba(255,215,0,0.04);
      box-shadow: 0 0 20px rgba(255,215,0,0.08), 0 0 0 3px rgba(255,215,0,0.06);
    }
    .err {
      font-size: 12px;
      color: #FF4444;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FFD700, #FFC107);
      color: #000;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .btn:hover  { 
      opacity: 0.92; 
      box-shadow: 0 0 30px rgba(255,215,0,0.2);
    }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.7;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,215,0,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: var(--accent);
    }
    #reconnecting {
      display: none;
      color: var(--accent);
      font-size: 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">KEYS<span class="logo-dot">.</span>AI</div>
    <div class="sub">Remote Access</div>
    <div class="version">ACENDENCE VII [GEN I]</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong>Remote Control</strong> in the Keys.ai desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--accent)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your Keys.ai URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('keysai_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('keysai_key', d.key);
          sessionStorage.setItem('keysai_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('keysai_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('keysai_key', key);
        sessionStorage.setItem('keysai_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
